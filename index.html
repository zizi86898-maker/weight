:root{--font:'IMHyemin',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
*{font-family:var(--font)!important}
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c1f26;--sub:#8a919e;--line:#e7e9ee;--acc:#3b6cf6;--up:#e5484d;--down:#2f6fed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);}
body{overscroll-behavior:none}
button{font-family:inherit}
.hide{display:none!important}

/* 로그인 */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
#login h1{font-size:28px;margin:0 0 6px}
#login p.s{color:var(--sub);margin:0 0 24px;font-size:14px}
#login input{width:100%;padding:15px 16px;font-size:17px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff;outline:none}
#login input:focus{border-color:var(--acc)}
#go{width:100%;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:600;margin-top:6px}
#msg{color:var(--up);font-size:14px;min-height:20px;margin-top:10px}

/* 앱 틀 */
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 12px) 14px 16px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:11px 0 9px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:24px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--acc);font-weight:700}
nav button.on .ic{filter:none;opacity:1}

/* 캘린더 */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.calhead h2{margin:0;font-size:20px}
.calhead button{border:0;background:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;color:var(--ink)}
#calSum{color:var(--sub);font-size:13px;margin:0 2px 12px}
.dows,#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dows span{text-align:center;font-size:12px;color:var(--sub);padding-bottom:4px}
.dows span:first-child{color:var(--up)}.dows span:last-child{color:var(--down)}
.cell{position:relative;aspect-ratio:1/1.5;min-width:0;border:0;background:var(--card);border-radius:10px;padding:0;color:inherit}
.cell.ex{background:#fffccc}
.cell.today{box-shadow:inset 0 0 0 2px var(--sub)}
.dn{position:absolute;top:4px;left:6px;font-size:11px;color:var(--sub);z-index:2}
.cell.sun .dn{color:var(--up)}.cell.sat .dn{color:var(--down)}
.wt{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--sub);z-index:2}
.stk{position:absolute;left:50%;top:50%;width:36px;height:36px;object-fit:contain;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r));filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
.tg img{width:22px;height:22px;vertical-align:-5px;margin-right:4px}

/* 입력 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet label{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
.wrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.wrow input{flex:1;padding:14px;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:14px;outline:none;width:100%}
.wrow input:focus{border-color:var(--acc)}
.wrow span{font-size:16px;color:var(--sub)}
.tg{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;margin-bottom:14px}
.tg.on{border-color:#f5b800;background:#fff8dc;font-weight:700}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:600}
.b-save{background:var(--acc);color:#fff}.b-del{background:#f1f2f5;color:var(--up)}.b-x{background:#f1f2f5;color:var(--ink)}

/* 그래프 */
.seg{display:flex;background:#e9ebf0;border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-size:14px;color:var(--sub);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card{background:#fff;border-radius:18px;padding:16px 12px 12px;margin-bottom:12px}
#hVal{font-size:34px;font-weight:800;letter-spacing:-1px;padding-left:6px}
#hVal small{font-size:16px;font-weight:600;color:var(--sub);margin-left:3px}
#hDate{font-size:13px;color:var(--sub);padding-left:6px;margin-top:2px}
#hChg{font-size:14px;font-weight:700;padding-left:6px;margin:4px 0 8px;min-height:20px}
#chart{touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart svg{display:block;width:100%;height:auto}
.empty{color:var(--sub);text-align:center;padding:70px 0;font-size:14px}
#stats{display:flex;gap:8px}
#stats div{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center}
#stats b{display:block;font-size:17px;margin-top:3px}
#stats span{font-size:12px;color:var(--sub)}

/* 설정 */
.set h2{margin:0 0 12px;font-size:20px}
.set .card{padding:16px}
.set p{margin:0 0 10px;font-size:14px;color:var(--sub);line-height:1.5}
.set button.act{width:100%;padding:13px;border:0;border-radius:12px;background:#f1f2f5;font-size:15px;font-weight:600;margin-top:6px;color:var(--ink)}
.set button.danger{color:var(--up)}
.set textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,22,28,.88);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>

<section id="login" class="hide">
  <h1>몸무게 기록</h1>
  <p class="s">아이디와 숫자 4자리만 정하면 시작돼요.<br>처음 입력한 조합이 그대로 내 계정이 돼요.</p>
  <input id="uid" placeholder="아이디" autocapitalize="off" autocorrect="off" autocomplete="username">
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="비밀번호 (숫자 4자리)" autocomplete="current-password">
  <button id="go">시작하기</button>
  <div id="msg"></div>
</section>

<div id="app" class="hide">
  <main>
    <div id="v-cal">
      <div class="calhead">
        <button id="prev" aria-label="이전 달">‹</button>
        <h2 id="calTitle"></h2>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <p id="calSum"></p>
      <div class="dows"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="grid"></div>
    </div>

    <div id="v-chart" class="hide">
      <div class="seg" id="seg">
        <button data-r="w" class="on">1주</button>
        <button data-r="m">1개월</button>
        <button data-r="q">3개월</button>
      </div>
      <div class="card">
        <div id="hVal"></div>
        <div id="hDate"></div>
        <div id="hChg"></div>
        <div id="chart"></div>
      </div>
      <div id="stats"></div>
    </div>

    <div id="v-set" class="hide set">
      <h2>설정</h2>
      <div class="card">
        <p id="who"></p>
        <button class="act" id="logout">로그아웃</button>
      </div>
      <div class="card">
        <p><b>백업</b><br>기록 전체를 글자로 복사해 둘 수 있어요. 메모 앱 같은 곳에 붙여 넣어 보관하세요.</p>
        <button class="act" id="copy">기록 복사하기</button>
        <p style="margin-top:14px"><b>복원</b><br>복사해 둔 글자를 아래에 붙여 넣고 복원을 누르세요.</p>
        <textarea id="restoreTxt" placeholder="여기에 붙여 넣기"></textarea>
        <button class="act" id="restore">복원하기</button>
      </div>
      <div class="card">
        <p><b>테스트용</b><br>화면이 어떻게 보이는지 확인하려고 임시 기록을 채워요. 실제 기록과 섞이니 처음에만 써보세요.</p>
        <button class="act" id="sample">샘플 기록 채우기</button>
        <button class="act danger" id="wipe">내 기록 모두 지우기</button>
      </div>
    </div>
  </main>

  <nav id="nav">
    <button data-v="cal" class="on" aria-label="캘린더"><span class="ic">📅</span></button>
    <button data-v="chart" aria-label="그래프"><span class="ic">📈</span></button>
    <button data-v="set" aria-label="설정"><span class="ic">⚙️</span></button>
  </nav>
</div>

<div class="scrim" id="scrim">
  <div class="sheet">
    <h3 id="shTitle"></h3>
    <label for="inW">몸무게</label>
    <div class="wrow"><input id="inW" type="text" inputmode="decimal" placeholder="예: 65.2"><span>kg</span></div>
    <button class="tg" id="tg">운동 안 했어요</button>
    <div class="btns">
      <button class="b-x" id="shX">닫기</button>
      <button class="b-del" id="shDel">지우기</button>
      <button class="b-save" id="shSave">저장</button>
    </div>
  </div>
</div>
<div id="toast"></div>

/* ---------- 저장 ---------- */
function persist(){
  ls.set('wt_data_'+user,JSON.stringify(data));
  // 나중에 클라우드 저장을 붙일 자리 (아이디 기준으로 data 전체를 올림)
}

/* ---------- 로그인 ---------- */
async function hashPin(id,pin){
  var s='wt|'+id+'|'+pin;
  try{
    if(window.crypto&&crypto.subtle){
      var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    }
  }catch(e){}
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;
  return 'x'+h.toString(16);
}
function msg(t){$('#msg').textContent=t}
$('#go').onclick=async function(){
  var id=$('#uid').value.trim().toLowerCase(), pin=$('#pin').value.trim();
  if(!id){msg('아이디를 입력해 주세요');return}
  if(!/^\d{4}$/.test(pin)){msg('비밀번호는 숫자 4자리예요');return}
  var h=await hashPin(id,pin), saved=ls.get('wt_pin_'+id);
  if(saved===null){ls.set('wt_pin_'+id,h)}
  else if(saved!==h){msg('비밀번호가 달라요');return}
  ls.set('wt_session',id);
  enter(id);
};
$('#pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('#go').click()});

function enter(id){
  user=id;
  try{data=JSON.parse(ls.get('wt_data_'+id)||'{}')}catch(e){data={}}
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#who').innerHTML='로그인 아이디: <b style="color:var(--ink)">'+id.replace(/[<>&]/g,'')+'</b>';
  msg('');$('#pin').value='';
  showView('cal');
}
$('#logout').onclick=function(){
  ls.del('wt_session');user=null;data={};
  $('#app').classList.add('hide');$('#login').classList.remove('hide');
};

/* ---------- 화면 전환 ---------- */
function showView(v){
  ['cal','chart','set'].forEach(function(x){$('#v-'+x).classList.toggle('hide',x!==v)});
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='cal')renderCal();
  if(v==='chart')renderChart();
}
$('#nav').onclick=function(e){var b=e.target.closest('button');if(b)showView(b.dataset.v)};

/* ---------- 캘린더 ---------- */
function renderCal(){
  var y=cursor.getFullYear(), m=cursor.getMonth();
  $('#calTitle').textContent=y+'년 '+(m+1)+'월';
  var lead=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  var today=fmt(new Date()), html='', cnt=0, i;
  for(var d=1;d<=n;d++){
    var k=y+'-'+pad(m+1)+'-'+pad(d), r=data[k], dow=(lead+d-1)%7;
    if(r&&r.x)cnt++;
    html+='<button class="cell'+(r&&r.x?' ex':'')+(k===today?' today':'')+(dow===0?' sun':'')+(dow===6?' sat':'')+'" data-k="'+k+'"'
      +(d===1&&lead?' style="grid-column-start:'+(lead+1)+'"':'')+'>'
      +'<span class="dn">'+d+'</span>'
      +(r&&r.x?'<img class="stk" src="'+STK+'" alt="운동" style="--r:'+(((d*37)%13)-6)+'deg">':'')
      +(r&&r.w!=null?'<span class="wt">'+r.w.toFixed(1)+'</span>':'')
      +'</button>';
  }
  $('#grid').innerHTML=html;
  $('#calSum').textContent='이번 달 운동 '+cnt+'일';
}
$('#prev').onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCal()};
$('#next').onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCal()};
$('#grid').onclick=function(e){var c=e.target.closest('.cell[data-k]');if(c)openSheet(c.dataset.k)};

/* ---------- 입력 시트 ---------- */
function setToggle(on){sheetEx=on;var t=$('#tg');t.classList.toggle('on',on);if(on)t.innerHTML='<img src="'+STK+'" alt="">운동 했어요';else t.textContent='운동 안 했어요'}
function openSheet(k){
  sheetKey=k;var r=data[k]||{};
  $('#shTitle').textContent=fmtKo(k);
  $('#inW').value=r.w!=null?r.w:'';
  setToggle(!!r.x);
  $('#scrim').classList.add('show');
}
function closeSheet(){$('#scrim').classList.remove('show');sheetKey=null}
$('#tg').onclick=function(){setToggle(!sheetEx)};
$('#shX').onclick=closeSheet;
$('#scrim').onclick=function(e){if(e.target===this)closeSheet()};
$('#shSave').onclick=function(){
  var raw=$('#inW').value.trim().replace(',','.'), w=raw===''?null:parseFloat(raw);
  if(raw!==''&&(isNaN(w)||w<20||w>300)){toast('몸무게를 다시 확인해 주세요');return}
  if(w!==null)w=Math.round(w*10)/10;
  if(w===null&&!sheetEx)delete data[sheetKey];
  else data[sheetKey]={w:w,x:sheetEx};
  persist();closeSheet();renderCal();
};
$('#shDel').onclick=function(){delete data[sheetKey];persist();closeSheet();renderCal()};

/* ---------- 그래프 ---------- */
$('#seg').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  range=b.dataset.r;
  document.querySelectorAll('#seg button').forEach(function(x){x.classList.toggle('on',x===b)});
  renderChart();
};
function updateHead(p){
  if(!pts.length){$('#hVal').innerHTML='-';$('#hDate').textContent='';$('#hChg').textContent='';return}
  var cur=p||pts[pts.length-1], first=pts[0], diff=cur.w-first.w;
  $('#hVal').innerHTML=cur.w.toFixed(1)+'<small>kg</small>';
  $('#hDate').textContent=(p?'':'최근 기록 · ')+fmtKo(cur.k);
  var e=$('#hChg');
  if(pts.length<2||Math.abs(diff)<0.05){e.style.color='var(--sub)';e.textContent=pts.length<2?'비교할 기록이 더 필요해요':'기간 시작과 같아요'}
  else{
    var up=diff>0, pc=diff/first.w*100;
    e.style.color=up?'var(--up)':'var(--down)';
    e.textContent=(up?'▲ ':'▼ ')+Math.abs(diff).toFixed(1)+'kg ('+(up?'+':'-')+Math.abs(pc).toFixed(1)+'%)';
  }
}
function renderChart(){
  var days={w:7,m:30,q:90}[range];
  var end=parse(fmt(new Date())), start=addDays(end,-(days-1)), sk=fmt(start), ek=fmt(end);
  pts=Object.keys(data).filter(function(k){return data[k].w!=null&&k>=sk&&k<=ek}).sort()
    .map(function(k){return {k:k,t:parse(k).getTime(),w:data[k].w}});
  var box=$('#chart');geo=null;
  updateHead(null);
  if(!pts.length){box.innerHTML='<div class="empty">이 기간에 기록된 몸무게가 없어요</div>';$('#stats').innerHTML='';return}

  var W=Math.max(280,box.clientWidth||340), H=240, pL=6, pR=44, pT=14, pB=26;
  var ws=pts.map(function(p){return p.w}), mn=Math.min.apply(null,ws), mx=Math.max.apply(null,ws);
  if(mx-mn<1){var c=(mx+mn)/2;mn=c-.5;mx=c+.5}
  var gap=(mx-mn)*.15;mn-=gap;mx+=gap;
  var t0=start.getTime(), t1=end.getTime();
  var X=function(t){return pL+(t-t0)/(t1-t0)*(W-pL-pR)};
  var Y=function(w){return pT+(1-(w-mn)/(mx-mn))*(H-pT-pB)};
  var pp=pts.map(function(p){return {x:X(p.t),y:Y(p.w),p:p}});
  var up=pts[pts.length-1].w>=pts[0].w, col=up?'#e5484d':'#2f6fed';

  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".22"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  for(var i=0;i<4;i++){
    var v=mn+(mx-mn)*i/3, y=Y(v);
    s+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y+'" y2="'+y+'" stroke="#eceef2" stroke-dasharray="3 4"/>';
    s+='<text x="'+(W-pR+6)+'" y="'+(y+4)+'" font-size="11" fill="#8a919e">'+v.toFixed(1)+'</text>';
  }
  var ticks=days===7?7:5;
  for(var j=0;j<ticks;j++){
    var dd=addDays(start,Math.round(j*(days-1)/(ticks-1)));
    var anchor=j===0?'start':(j===ticks-1?'end':'middle');
    s+='<text x="'+X(dd.getTime())+'" y="'+(H-6)+'" font-size="11" fill="#8a919e" text-anchor="'+anchor+'">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>';
  }
  var line=pp.map(function(q,i){return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)}).join(' ');
  if(pp.length>1){
    s+='<path d="'+line+' L'+pp[pp.length-1].x.toFixed(1)+' '+(H-pB)+' L'+pp[0].x.toFixed(1)+' '+(H-pB)+' Z" fill="url(#gr)"/>';
    s+='<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  if(pp.length<=31)pp.forEach(function(q){s+='<circle cx="'+q.x+'" cy="'+q.y+'" r="'+(pp.length>1?2.6:4.5)+'" fill="'+col+'"/>'});
  var L=pp[pp.length-1];
  s+='<circle cx="'+L.x+'" cy="'+L.y+'" r="5" fill="#fff" stroke="'+col+'" stroke-width="2.5"/>';
  s+='<line id="cl" y1="'+pT+'" y2="'+(H-pB)+'" stroke="#9aa1ae" stroke-width="1" class="hide"/>';
  s+='<circle id="cd" r="6" fill="#fff" stroke="'+col+'" stroke-width="3" class="hide"/>';
  s+='</svg>';
  box.innerHTML=s;
  geo={W:W,pp:pp};

  var avg=ws.reduce(function(a,b){return a+b},0)/ws.length;
  $('#stats').innerHTML='<div><span>최저</span><b>'+Math.min.apply(null,ws).toFixed(1)+'</b></div>'
    +'<div><span>평균</span><b>'+avg.toFixed(1)+'</b></div>'
    +'<div><span>최고</span><b>'+Math.max.apply(null,ws).toFixed(1)+'</b></div>';
}
function onMove(e){
  if(!geo)return;
  var svg=$('#chart svg');if(!svg)return;
  var r=svg.getBoundingClientRect(), x=(e.clientX-r.left)*(geo.W/r.width), best=0, bd=1e9;
  geo.pp.forEach(function(q,i){var d=Math.abs(q.x-x);if(d<bd){bd=d;best=i}});
  var q=geo.pp[best], cl=$('#cl'), cd=$('#cd');
  cl.setAttribute('x1',q.x);cl.setAttribute('x2',q.x);cl.classList.remove('hide');
  cd.setAttribute('cx',q.x);cd.setAttribute('cy',q.y);cd.classList.remove('hide');
  updateHead(q.p);
}
function onEnd(){
  var cl=$('#cl'), cd=$('#cd');
  if(cl)cl.classList.add('hide');
  if(cd)cd.classList.add('hide');
  updateHead(null);
}
var chartBox=$('#chart');
chartBox.addEventListener('pointerdown',onMove);
chartBox.addEventListener('pointermove',onMove);
chartBox.addEventListener('pointerup',onEnd);
chartBox.addEventListener('pointercancel',onEnd);
chartBox.addEventListener('pointerleave',onEnd);
window.addEventListener('resize',function(){if(!$('#v-chart').classList.contains('hide'))renderChart()});

/* ---------- 설정: 백업·복원·샘플 ---------- */
$('#copy').onclick=function(){
  var txt=JSON.stringify({app:'wt',user:user,data:data});
  function fallback(){var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('복사했어요')}catch(e){toast('복사에 실패했어요')}t.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('복사했어요')},fallback)}else fallback();
};
$('#restore').onclick=function(){
  try{
    var o=JSON.parse($('#restoreTxt').value.trim());
    if(!o||o.app!=='wt'||typeof o.data!=='object')throw 0;
    if(!confirm('지금 기록을 붙여 넣은 기록으로 합칠까요? (같은 날짜는 덮어써요)'))return;
    Object.keys(o.data).forEach(function(k){data[k]=o.data[k]});
    persist();$('#restoreTxt').value='';toast('복원했어요');
  }catch(e){toast('올바른 백업 글자가 아니에요')}
};
$('#sample').onclick=function(){
  var w=66.5, today=new Date();
  for(var i=100;i>=0;i--){
    var d=addDays(today,-i), k=fmt(d);
    w+=(Math.random()-.56)*.35;
    if(Math.random()<.78)data[k]={w:Math.round(w*10)/10,x:Math.random()<.45};
    else if(Math.random()<.3)data[k]={w:null,x:true};
  }
  persist();toast('샘플 기록을 채웠어요');
};
$('#wipe').onclick=function(){
  if(confirm('내 기록을 모두 지울까요? 되돌릴 수 없어요.')){data={};persist();toast('모두 지웠어요')}
};

/* ---------- 시작 ---------- */
var s=ls.get('wt_session');
if(s&&ls.get('wt_pin_'+s)!==null)enter(s);else $('#login').classList.remove('hide');

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
